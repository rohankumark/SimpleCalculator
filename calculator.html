<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simple Calculator</title>
<style>
  :root {
    --bg: #f2f3f5;
    --panel: #ffffff;
    --text: #4b5563;
    --muted: #9ca3af;
    --key: #eceef1;
    --key-hover: #e0e3e7;
    --op: #2563eb;
    --op-hover: #1d4ed8;
    --op-text: #ffffff;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121417;
      --panel: #1c1f24;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --key: #2a2e35;
      --key-hover: #353a42;
      --op: #3b82f6;
      --op-hover: #60a5fa;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .calc {
    width: 100%;
    max-width: 320px;
    background: var(--panel);
    border-radius: 20px;
    padding: 20px;
    box-shadow: var(--shadow);
  }
  .display {
    text-align: right;
    padding: 8px 4px 16px;
    min-height: 92px;
    overflow: hidden;
  }
  .history {
    color: var(--muted);
    font-size: 15px;
    min-height: 20px;
  }
  .current {
    font-size: 40px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    word-break: break-all;
  }
  .keys {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  button {
    font: inherit;
    font-size: 20px;
    height: 60px;
    border: 0;
    border-radius: 14px;
    background: var(--key);
    color: var(--text);
    cursor: pointer;
    transition: background 0.12s, transform 0.05s;
  }
  button:hover { background: var(--key-hover); }
  button:active { transform: scale(0.96); }
  button:focus-visible { outline: 2px solid var(--op); outline-offset: 2px; }
  .op, .eq { background: var(--op); color: var(--op-text); }
  .op:hover, .eq:hover { background: var(--op-hover); }
  .fn { color: var(--op); font-weight: 600; }
  .zero { grid-column: span 2; }
</style>
</head>
<body>
  <main class="calc">
    <div class="display" aria-live="polite">
      <div class="history" id="history"></div>
      <div class="current" id="current">0</div>
    </div>
    <div class="keys">
      <button class="fn" data-action="clear">AC</button>
      <button class="fn" data-action="sign">±</button>
      <button class="fn" data-action="percent">%</button>
      <button class="op" data-op="/">÷</button>

      <button data-digit="7">7</button>
      <button data-digit="8">8</button>
      <button data-digit="9">9</button>
      <button class="op" data-op="*">×</button>

      <button data-digit="4">4</button>
      <button data-digit="5">5</button>
      <button data-digit="6">6</button>
      <button class="op" data-op="-">−</button>

      <button data-digit="1">1</button>
      <button data-digit="2">2</button>
      <button data-digit="3">3</button>
      <button class="op" data-op="+">+</button>

      <button class="zero" data-digit="0">0</button>
      <button data-action="decimal">.</button>
      <button class="eq" data-action="equals">=</button>
    </div>
  </main>

<script>
  const symbols = { "+": "+", "-": "−", "*": "×", "/": "÷" };
  const currentEl = document.getElementById("current");
  const historyEl = document.getElementById("history");

  let current = "0";
  let previous = null;
  let operator = null;
  let resetNext = false;

  function format(value) {
    if (value === "Error") return value;
    const n = Number(value);
    if (!isFinite(n)) return "Error";
    // Keep what the user is typing (e.g. "3." or "0.50") as-is
    if (typeof value === "string" && /[.]/.test(value)) return value;
    return String(parseFloat(n.toPrecision(12)));
  }

  function render() {
    currentEl.textContent = format(current);
    historyEl.textContent = operator ? `${format(previous)} ${symbols[operator]}` : "";
  }

  function compute(a, b, op) {
    a = Number(a); b = Number(b);
    switch (op) {
      case "+": return a + b;
      case "-": return a - b;
      case "*": return a * b;
      case "/": return b === 0 ? "Error" : a / b;
    }
  }

  function inputDigit(d) {
    if (resetNext || current === "0" || current === "Error") {
      current = d;
      resetNext = false;
    } else if (current.length < 15) {
      current += d;
    }
  }

  function inputDecimal() {
    if (resetNext || current === "Error") { current = "0."; resetNext = false; return; }
    if (!current.includes(".")) current += ".";
  }

  function chooseOperator(op) {
    if (current === "Error") return;
    if (operator && !resetNext) {
      const result = compute(previous, current, operator);
      current = String(result);
      if (result === "Error") { previous = null; operator = null; resetNext = true; return; }
    }
    previous = current;
    operator = op;
    resetNext = true;
  }

  function equals() {
    if (!operator || current === "Error") return;
    const result = compute(previous, current, operator);
    historyEl.textContent = `${format(previous)} ${symbols[operator]} ${format(current)} =`;
    current = String(result);
    previous = null;
    operator = null;
    resetNext = true;
    currentEl.textContent = format(current);
  }

  function clearAll() {
    current = "0"; previous = null; operator = null; resetNext = false;
  }

  function backspace() {
    if (resetNext || current === "Error") return;
    current = current.length > 1 ? current.slice(0, -1) : "0";
    if (current === "-") current = "0";
  }

  function handle(fn) { fn(); render(); }

  document.querySelector(".keys").addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    const { digit, op, action } = btn.dataset;
    if (digit) return handle(() => inputDigit(digit));
    if (op) return handle(() => chooseOperator(op));
    switch (action) {
      case "clear": return handle(clearAll);
      case "decimal": return handle(inputDecimal);
      case "sign": return handle(() => { if (current !== "0" && current !== "Error") current = String(-Number(current)); });
      case "percent": return handle(() => { if (current !== "Error") current = String(Number(current) / 100); });
      case "equals": return equals();
    }
  });

  document.addEventListener("keydown", (e) => {
    const k = e.key;
    if (/^[0-9]$/.test(k)) handle(() => inputDigit(k));
    else if (k === ".") handle(inputDecimal);
    else if (symbols[k]) { e.preventDefault(); handle(() => chooseOperator(k)); }
    else if (k === "Enter" || k === "=") { e.preventDefault(); equals(); }
    else if (k === "Backspace") handle(backspace);
    else if (k === "Escape") handle(clearAll);
  });

  render();
</script>
</body>
</html>
